<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Hospital Agent Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="bg-soft">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="/">Carestac</a>
        <div class="ms-auto">
          <a href="/" class="btn btn-link text-dark">Home</a>
          <a href="/onboarding.html" class="btn btn-outline-primary">Super admin</a>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
          <div class="card border-0 shadow-lg rounded-4">
            <div class="card-body p-4 p-lg-5">
              <div class="text-center mb-4">
                <div class="rounded-circle bg-primary-subtle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                  <span class="text-primary fw-bold fs-4">C</span>
                </div>
                <h2 class="fw-bold">Welcome back</h2>
                <p class="text-muted mb-0">Sign in as a tenant admin or super admin</p>
              </div>

              <form id="loginForm">
                <div class="mb-3">
                  <label class="form-label">Email address</label>
                  <input type="email" class="form-control form-control-lg" id="email" value="admin@skycare.in" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input type="password" class="form-control form-control-lg" id="password" value="admin123" required />
                </div>
                <div class="d-grid gap-2">
                  <button type="submit" class="btn btn-primary btn-lg">Sign in</button>
                </div>
              </form>

              <div class="mt-4 p-3 rounded-3 bg-light small text-muted">
                Demo login: admin@skycare.in / admin123
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
