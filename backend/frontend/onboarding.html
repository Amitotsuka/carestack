<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onboard Tenant | Hospital Agent Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="bg-soft">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="/">CareStack</a>
        <div class="ms-auto">
          <a href="/" class="btn btn-link text-dark">Home</a>
          <a href="/login.html" class="btn btn-outline-primary">Login</a>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-lg-5">
              <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                  <p class="text-uppercase text-primary small fw-bold mb-1">Super admin</p>
                  <h2 class="fw-bold mb-0">Tenant onboarding</h2>
                </div>
                <span class="badge text-bg-primary rounded-pill p-2">Multi-tenant</span>
              </div>

              <form id="onboardingForm">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Tenant name</label>
                    <input type="text" class="form-control" id="tenant_name" placeholder="Sunrise Hospitals" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Tenant domain</label>
                    <input type="text" class="form-control" id="tenant_domain" placeholder="sunrise" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Admin name</label>
                    <input type="text" class="form-control" id="admin_name" placeholder="Admin Name" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Admin email</label>
                    <input type="email" class="form-control" id="admin_email" placeholder="admin@tenant.com" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Admin phone</label>
                    <input type="tel" class="form-control" id="admin_phone" placeholder="+91 98xxx xxxxx" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Plan</label>
                    <select class="form-select" id="plan">
                      <option value="starter">Starter</option>
                      <option value="growth" selected>Growth</option>
                      <option value="enterprise">Enterprise</option>
                    </select>
                  </div>
                  <div class="col-md-12">
                    <label class="form-label">Region</label>
                    <input type="text" class="form-control" id="region" value="India" required />
                  </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-4 flex-wrap gap-3">
                  <button type="submit" class="btn btn-primary btn-lg">Create tenant</button>
                  <a href="/login.html" class="text-muted">Open login</a>
                </div>
              </form>

              <div class="alert alert-info mt-4 mb-0 d-none" id="tenantSuccess"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
