# Standalone Render Blueprint for the private Python booking agent.
# In Render, select this as the Blueprint file path to deploy only this service.
# Do not sync render.yaml as another Blueprint for this same service.
services:
  - type: pserv
    name: carestack-uat-agent
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: PORT
        value: "10000"
